name: Update VBC Zandhoven Standen

on:
  schedule:
    - cron: '0 * * * *' # Elk uur automatisch
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install xlrd

      - name: Run Python script
        run: python update_dashboard.py

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add teams_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatische update van teamstanden" && git push)
